<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e7c1"/>
      <stop offset="28%" stop-color="#c5b48a"/>
      <stop offset="62%" stop-color="#3f5c3a"/>
      <stop offset="100%" stop-color="#101f16"/>
    </linearGradient>
    <radialGradient id="fo-sun" cx="42%" cy="8%" r="38%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity=".85"/>
      <stop offset="40%" stop-color="#fde68a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fo-beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fo-bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2e22"/>
      <stop offset="35%" stop-color="#2a4332"/>
      <stop offset="100%" stop-color="#0c1812"/>
    </linearGradient>
    <filter id="fo-haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="fo-mist" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#fo-sky)"/>
  <ellipse cx="780" cy="80" rx="520" ry="280" fill="url(#fo-sun)"/>
  <g opacity=".55">
    <polygon fill="url(#fo-beam)" points="640,-20 820,-20 1080,1080 420,1080"/>
    <polygon fill="url(#fo-beam)" points="860,-40 980,-40 1240,1080 720,1080" opacity=".7"/>
    <polygon fill="url(#fo-beam)" points="500,0 600,0 780,1080 280,1080" opacity=".45"/>
  </g>
  <g filter="url(#fo-haze)" opacity=".7">
    <ellipse cx="200" cy="-20" rx="280" ry="160" fill="#1a3324"/>
    <ellipse cx="620" cy="-40" rx="240" ry="140" fill="#23402c"/>
    <ellipse cx="1100" cy="-10" rx="300" ry="170" fill="#173024"/>
    <ellipse cx="1680" cy="10" rx="320" ry="180" fill="#1c3828"/>
  </g>
  <g fill="url(#fo-bark)">
    <rect x="70" y="80" width="22" height="1000" rx="10"/>
    <rect x="210" y="40" width="36" height="1040" rx="14"/>
    <rect x="390" y="120" width="18" height="960" rx="8"/>
    <rect x="520" y="20" width="44" height="1060" rx="16"/>
    <rect x="710" y="90" width="24" height="990" rx="10"/>
    <rect x="860" y="10" width="52" height="1070" rx="18"/>
    <rect x="1060" y="70" width="20" height="1010" rx="9"/>
    <rect x="1210" y="30" width="40" height="1050" rx="15"/>
    <rect x="1390" y="110" width="16" height="970" rx="8"/>
    <rect x="1520" y="50" width="34" height="1030" rx="13"/>
    <rect x="1690" y="20" width="48" height="1060" rx="17"/>
    <rect x="1840" y="90" width="22" height="990" rx="10"/>
  </g>
  <g fill="#0a1410" opacity=".55">
    <rect x="140" y="200" width="14" height="880" rx="7"/>
    <rect x="640" y="160" width="12" height="920" rx="6"/>
    <rect x="980" y="220" width="15" height="860" rx="7"/>
    <rect x="1460" y="180" width="13" height="900" rx="6"/>
  </g>
  <g filter="url(#fo-mist)">
    <ellipse cx="960" cy="980" rx="1100" ry="160" fill="#dce7d4" opacity=".45"/>
    <ellipse cx="400" cy="920" rx="480" ry="90" fill="#f4f0de" opacity=".28"/>
    <ellipse cx="1500" cy="940" rx="520" ry="100" fill="#e8f0dc" opacity=".3"/>
  </g>
</svg>
